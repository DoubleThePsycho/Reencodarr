<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>

    <g id="arrow-shape">
      <path d="M -186 232 A 302.4 302.4 0 0 1 -260.6 -162.8 L -230.8 -144.2 A 277 277 0 0 0 -176.3 220 Z" fill="#1b828c"/>
      <path d="M -219 -208 L -282 -178 Q -293 -172 -283 -166 L -218 -126 Q -208 -120 -208 -132 L -208 -201 Q -208 -213 -219 -208 Z" fill="#1b828c"/>
      <rect x="-250" y="150" width="15" height="30" fill="#e7f4f4" transform="rotate(235 -238 165)"/>
      <rect x="-215" y="189" width="15" height="30" fill="#e7f4f4" transform="rotate(225 -206 204)"/>
    </g>

    <g id="reel-holes" fill="black">
      <circle cx="400" cy="400" r="50"/>
      <circle cx="400" cy="600" r="50"/>
      <circle cx="300" cy="500" r="50"/>
      <circle cx="500" cy="500" r="50"/>
      <circle cx="400" cy="500" r="35"/>
    </g>

    <mask id="reel-mask" x="0" y="0" width="800" height="800" maskUnits="userSpaceOnUse">
      <rect width="800" height="800" fill="white"/>
      <use href="#reel-holes"/>
    </mask>
  </defs>

  <!-- Background -->
  <circle cx="400" cy="400" r="400" fill="#1b828c"/>
  <circle cx="400" cy="400" r="360" fill="#e7f4f4"/>

  <!-- Body -->
  <circle cx="400" cy="300" r="165" fill="#1b263b"/>
  <rect x="235" y="300" width="330" height="300" fill="#1b263b" />
  <path d="M370 138 C384 117 402 99 421 99 c5 0 7 4 5 8 c-4 8-10 18-6 36 c3 11-2 18-10 20 c-8-16-23-26-40-25Z" fill="#1b263b"/>
  <ellipse cx="240" cy="400" rx="50" ry="75" fill="#1b263b" transform="rotate(25 200 400)"/>
  <ellipse cx="560" cy="400" rx="50" ry="75" fill="#1b263b" transform="rotate(-25 600 400)"/>

  <!-- Face -->
  <rect x="275" y="270" width="250" height="300" fill="#ffffff" />
  <circle cx="350" cy="270" r="75" fill="#ffffff"/>
  <circle cx="450" cy="270" r="75" fill="#ffffff"/>
  <circle cx="350" cy="270" r="22.5" fill="#1b828c"/>
  <circle cx="450" cy="270" r="22.5" fill="#1b828c"/>
  <circle cx="357" cy="263" r="7.5" fill="#ffffff"/>
  <circle cx="457" cy="263" r="7.5" fill="#ffffff"/>

  <!-- Reel -->
  <circle cx="400" cy="500" r="200" fill="#0d1b2a"/>
  <circle cx="400" cy="500" r="100" fill="#1b828c"/>
  <circle cx="400" cy="500" r="75" fill="#33abba"/>
  <circle cx="400" cy="500" r="190" fill="#ffffff" mask="url(#reel-mask)"/>
  <circle cx="400" cy="500" r="180" fill="#eeeeee" mask="url(#reel-mask)"/>

  <g transform="translate(400 400)">
    <use href="#arrow-shape"/>
    <use href="#arrow-shape" transform="rotate(180)"/>
  </g>
</svg>
